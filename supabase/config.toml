# Composer Studio :: Supabase project configuration
#
# `project_id` is the local stack's container namespace, not the hosted project
# ref. Link to the hosted project with `supabase link --project-ref <ref>`.
project_id = "composer-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Caps an unbounded PostgREST query. list_mails paginates in the client anyway.
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Local mailbox for auth emails (signup confirmation, magic links).
# Campaign sending does NOT go through this -- that is the EMAIL_PROVIDER adapter.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Off locally so signing up during development does not require a mail round
# trip. Turn this ON in the hosted project.
enable_confirmations = false

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------

[functions.send-mail]
verify_jwt = true

[functions.dispatch-scheduled]
# Called by pg_cron with the service-role key, which is a valid JWT.
verify_jwt = true

[functions.track]
# Open pixels and click links are fetched by mail clients and browsers that
# cannot present a JWT. Authentication for this endpoint is the HMAC signature
# on the token instead (see _shared/signing.ts).
verify_jwt = false
